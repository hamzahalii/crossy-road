<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Crossy Road 3D Voxel</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #70c1b3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; }

    .hidden { display: none !important; }

    /* ── UI Layer ── */
    #ui-container {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 10;
    }
    #ui-container > * { pointer-events: auto; }

    /* ── HUD ── */
    #hud {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
    }
    #hud-score {
      position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
      font-size: 64px; font-weight: 900; color: #ffffff;
      text-shadow: 4px 4px 0 rgba(0,0,0,0.4);
      letter-spacing: 2px;
    }
    #hud-coins {
      position: absolute; top: 30px; right: 30px;
      font-size: 24px; font-weight: 800; color: #FFD700;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
      background: rgba(0,0,0,0.3);
      padding: 6px 14px; border-radius: 20px;
    }

    /* ── Buttons ── */
    .btn {
      padding: 14px 32px; margin: 8px;
      font-size: 18px; font-weight: 800;
      color: #fff; border: none; border-radius: 12px;
      cursor: pointer; text-transform: uppercase;
      box-shadow: 0 5px 0 rgba(0,0,0,0.3);
      transition: transform 0.1s, box-shadow 0.1s;
      outline: none;
    }
    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 rgba(0,0,0,0.3);
    }
    .btn-primary { background: #e74c3c; }
    .btn-secondary { background: #3498db; }
    .btn-gold { background: #f39c12; }
    .btn-row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }

    /* ── Screens Common ── */
    .screen-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(2px);
    }

    /* ── Title Screen ── */
    #screen-title {
      cursor: pointer;
    }
    #screen-title h1 {
      font-size: 68px; font-weight: 900; color: #ffffff;
      text-shadow: 5px 5px 0 #e74c3c, 9px 9px 0 rgba(0,0,0,0.35);
      letter-spacing: 3px;
      margin-bottom: 6px;
      animation: floatTitle 1.4s ease-in-out infinite alternate;
    }
    @keyframes floatTitle {
      from { transform: translateY(0); }
      to { transform: translateY(-12px); }
    }
    #screen-title .subtitle {
      font-size: 22px; color: rgba(255,255,255,0.9);
      margin-bottom: 30px; font-weight: 700;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.3);
    }
    #screen-title .tap-prompt {
      font-size: 26px; color: #ffffff; font-weight: 800;
      letter-spacing: 2px;
      animation: pulse 1.2s ease-in-out infinite;
      margin-bottom: 25px;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.96); }
    }
    #title-highscore {
      font-size: 20px; font-weight: 700; color: #FFD700;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
      margin-bottom: 25px;
    }

    /* ── Game Over Screen ── */
    #screen-game-over h2 {
      font-size: 50px; font-weight: 900; color: #fff;
      text-shadow: 3px 3px 0 rgba(0,0,0,0.4); margin-bottom: 10px;
    }
    #game-over-score {
      font-size: 84px; font-weight: 900; color: #FFD700;
      text-shadow: 4px 4px 0 rgba(0,0,0,0.4);
      margin-bottom: 4px;
    }
    #game-over-new-high {
      font-size: 24px; color: #2ecc71; font-weight: 800;
      animation: pulse 0.6s ease-in-out infinite;
      margin-bottom: 12px;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
    }
    #game-over-highscore {
      font-size: 20px; color: rgba(255,255,255,0.75);
      font-weight: 700; margin-bottom: 28px;
    }

    /* ── Character Select Screen ── */
    #screen-characters {
      padding: 30px 20px;
      overflow-y: auto;
      justify-content: flex-start;
      background: rgba(10, 10, 15, 0.92);
    }
    #screen-characters h2 {
      font-size: 38px; color: #fff; margin-bottom: 20px; font-weight: 900;
    }
    #character-grid {
      max-width: 680px; width: 100%; margin-bottom: 25px;
    }
    .char-theme-heading {
      color: #FFD700; font-size: 20px; font-weight: 800;
      margin: 16px 0 8px 4px; text-transform: uppercase; letter-spacing: 1px;
    }
    .char-theme-row {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
      gap: 10px; margin-bottom: 12px;
    }
    .char-tile {
      aspect-ratio: 1; border-radius: 12px; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(255,255,255,0.08);
      border: 3px solid transparent;
      box-shadow: 0 4px 0 rgba(0,0,0,0.3);
      transition: transform 0.15s, border-color 0.15s, background 0.15s;
    }
    .char-tile:hover {
      transform: scale(1.08);
      background: rgba(255,255,255,0.16);
    }
    .char-tile.selected {
      border-color: #FFD700;
      background: rgba(255,215,0,0.2);
    }
    .char-tile.locked {
      opacity: 0.35; filter: grayscale(1); cursor: not-allowed;
    }
    .char-emoji { font-size: 32px; }
    .char-name { font-size: 10px; color: #fff; font-weight: 700; margin-top: 4px; text-align: center; }

    /* ── Gumball Machine Screen ── */
    #screen-gumball {
      background: rgba(15, 15, 25, 0.92);
    }
    #screen-gumball h2 {
      font-size: 40px; color: #fff; font-weight: 900; margin-bottom: 16px;
    }
    #gumball-coins {
      font-size: 26px; color: #FFD700; font-weight: 800; margin-bottom: 16px;
    }
    .gumball-cost-label {
      font-size: 16px; color: rgba(255,255,255,0.6); margin-bottom: 24px;
    }
    #gumball-result {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      margin: 16px 0 24px 0;
      animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #gumball-result-emoji { font-size: 80px; }
    #gumball-result-name {
      font-size: 24px; color: #FFD700; font-weight: 800; margin-top: 8px;
    }
    @keyframes popIn {
      from { transform: scale(0.2); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    .shake {
      animation: shakeAnim 0.35s ease-in-out;
    }
    @keyframes shakeAnim {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }

    @media (max-width: 600px) {
      #screen-title h1 { font-size: 44px; }
      #hud-score { font-size: 48px; top: 20px; }
      #hud-coins { font-size: 18px; top: 20px; right: 15px; }
      .btn { padding: 12px 24px; font-size: 16px; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <div id="ui-container">
    <!-- HUD Overlay -->
    <div id="hud" class="hidden">
      <div id="hud-score">0</div>
      <div id="hud-coins">💰 0</div>
    </div>

    <!-- Title Screen -->
    <div id="screen-title" class="screen-overlay">
      <h1>CROSSY ROAD</h1>
      <div class="subtitle">🐔 Endless Voxel Hopper</div>
      <div class="tap-prompt">TAP OR PRESS ARROW UP TO PLAY</div>
      <div id="title-highscore"></div>
      <div class="btn-row">
        <button class="btn btn-secondary" id="btn-characters">🎭 Characters</button>
        <button class="btn btn-gold" id="btn-gumball">🎰 Gumball</button>
      </div>
    </div>

    <!-- Game Over Screen -->
    <div id="screen-game-over" class="screen-overlay hidden">
      <h2>GAME OVER</h2>
      <div id="game-over-score">0</div>
      <div id="game-over-new-high" class="hidden">🏆 NEW HIGH SCORE!</div>
      <div id="game-over-highscore">Best: 0</div>
      <div class="btn-row">
        <button class="btn btn-primary" id="btn-retry">↻ PLAY AGAIN</button>
        <button class="btn btn-secondary" id="btn-menu">MENU</button>
      </div>
    </div>

    <!-- Characters Screen -->
    <div id="screen-characters" class="screen-overlay hidden">
      <h2>🎭 CHARACTERS</h2>
      <div id="character-grid"></div>
      <button class="btn btn-secondary" id="btn-char-back">← BACK</button>
    </div>

    <!-- Gumball Screen -->
    <div id="screen-gumball" class="screen-overlay hidden">
      <h2>🎰 GUMBALL MACHINE</h2>
      <div id="gumball-coins">💰 0</div>
      <div class="gumball-cost-label">Each pull costs 5 💰</div>
      <div id="gumball-result" class="hidden">
        <div id="gumball-result-emoji">🐔</div>
        <div id="gumball-result-name">Chicken</div>
      </div>
      <div class="btn-row">
        <button class="btn btn-gold" id="btn-pull">INSERT 5 💰</button>
        <button class="btn btn-secondary" id="btn-gumball-back">← BACK</button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
